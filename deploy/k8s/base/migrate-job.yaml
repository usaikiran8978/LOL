# One-shot migration job, applied (with a unique name suffix) before each rollout. Migrations are forward-only and
# guarded by an advisory lock + checksums (apps/api/scripts/migrate.ts), so a concurrent or repeated run is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: amora-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: migrate
          image: ghcr.io/OWNER/amora-migrate:latest
          envFrom: [{ secretRef: { name: amora-api-env } }]
          env: [{ name: NODE_ENV, value: production }]
