# API: stateless; config + secrets come from the `amora-api-env` Secret (see docs/runbooks/deployment.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amora-api
  labels: { app: amora-api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: amora-api }
  template:
    metadata:
      labels: { app: amora-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: ghcr.io/OWNER/amora-api:latest # replaced by kustomize `images`
          ports: [{ containerPort: 3000, name: http }]
          envFrom: [{ secretRef: { name: amora-api-env } }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: LOG_FORMAT, value: json }
            - { name: TRUST_PROXY, value: "true" }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 15, failureThreshold: 4, initialDelaySeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: amora-api, labels: { app: amora-api } }
spec:
  selector: { app: amora-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: amora-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amora-api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: amora-api }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: amora-api } }
