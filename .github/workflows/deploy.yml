name: Deploy

# Builds immutable images (tagged with the commit SHA) and promotes them staging → production.
# The `staging` and `production` GitHub environments must be configured with required reviewers and the secret
# KUBE_CONFIG (base64 kubeconfig for a deploy-only service account). See docs/runbooks/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, target: api, push: true, tags: "${{ env.REGISTRY }}/amora-api:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, target: migrate, push: true, tags: "${{ env.REGISTRY }}/amora-migrate:${{ github.sha }}", cache-from: type=gha }

  staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/rollout.sh staging "${{ env.REGISTRY }}" "${{ needs.images.outputs.tag }}"
        env: { KUBE_CONFIG: "${{ secrets.KUBE_CONFIG }}" }

  production:
    needs: [images, staging]
    runs-on: ubuntu-latest
    environment: production # required reviewers gate this job
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/rollout.sh production "${{ env.REGISTRY }}" "${{ needs.images.outputs.tag }}"
        env: { KUBE_CONFIG: "${{ secrets.KUBE_CONFIG }}" }
