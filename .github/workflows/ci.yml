name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — typecheck, unit + e2e tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/amora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # postinstall compiles packages/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm audit --omit=dev --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with: { name: npm-audit, path: npm-audit.json }
      - run: npm audit --omit=dev --audit-level=critical

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: api, push: false, tags: lol-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., target: migrate, push: false, tags: lol-migrate:ci, cache-from: type=gha }

  dast:
    name: DAST — OWASP ZAP API baseline
    runs-on: ubuntu-latest
    needs: [api]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: amora }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/amora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: npm run db:migrate && npm run db:seed
      - name: Start API (development mode so the OpenAPI document is served)
        run: |
          export JWT_ACCESS_SECRET=$(openssl rand -hex 32) OTP_PEPPER=$(openssl rand -hex 32) SIGNING_SECRET=$(openssl rand -hex 32) FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health/ready && break; sleep 2; done
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:3000/docs-json
          format: openapi
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: api-log, path: api.log }
